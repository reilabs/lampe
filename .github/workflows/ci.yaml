name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-ci-image:
    uses: ./.github/workflows/build-ci-image.yaml
    with:
      allow_push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  keys:
    name: Compute Cache Keys
    runs-on: ubuntu-latest
    outputs:
      rustfmt_key: ${{ steps.keys.outputs.rustfmt_key }}
      rustlint_key: ${{ steps.keys.outputs.rustlint_key }}
      rusttest_key: ${{ steps.keys.outputs.rusttest_key }}
      cli_key: ${{ steps.keys.outputs.cli_key }}
      lampe_key: ${{ steps.keys.outputs.lampe_key }}
      stdlib_key: ${{ steps.keys.outputs.stdlib_key }}
      e2e_key: ${{ steps.keys.outputs.e2e_key }}
      rustfmt_hit: ${{ steps.rustfmt.outputs.cache-hit }}
      rustlint_hit: ${{ steps.rustlint.outputs.cache-hit }}
      rusttest_hit: ${{ steps.rusttest.outputs.cache-hit }}
      e2e_hit: ${{ steps.e2e.outputs.cache-hit }}
      lampe_hit: ${{ steps.lampe.outputs.cache-hit }}
      stdlib_hit: ${{ steps.stdlib.outputs.cache-hit }}
    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v6
      - name: Compute Keys
        id: keys
        run: |
          {
            echo "rustfmt_key=rustfmt-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'src/**') }}"
            echo "rustlint_key=rustlint-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'src/**') }}"
            echo "rusttest_key=rusttest-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'src/**') }}"
            echo "cli_key=cli-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'src/**', 'Lampe/lean-toolchain') }}"
            echo "lampe_key=lampe-build-${{ runner.os }}-${{ hashFiles('Lampe/**/*.lean', 'Lampe/**/*.toml', 'Lampe/**/*.json', 'Lampe/lean-toolchain', 'Lampe/lake-manifest.json') }}"
            echo "stdlib_key=stdlib-build-${{ runner.os }}-${{ hashFiles('stdlib/src/**', 'stdlib/Nargo.toml', 'stdlib/test.xsh', 'stdlib/lampe/**/*.lean', 'stdlib/lampe/lean-toolchain', 'stdlib/lampe/lake-manifest.json', 'stdlib/lampe/lakefile.toml', 'Lampe/**/*.lean', 'Lampe/**/*.toml', 'Lampe/**/*.json', 'Lampe/lean-toolchain', 'Lampe/lake-manifest.json', 'scripts/test.xsh', 'scripts/utils.xsh', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'src/**') }}"
            echo "e2e_key=e2e-${{ runner.os }}-${{ hashFiles('testing/**', 'scripts/test.xsh', 'scripts/utils.xsh', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'src/**', 'Lampe/**/*.lean', 'Lampe/**/*.toml', 'Lampe/**/*.json', 'Lampe/lean-toolchain', 'Lampe/lake-manifest.json', 'stdlib/src/**', 'stdlib/Nargo.toml', 'stdlib/lampe/**/*.lean', 'stdlib/lampe/lean-toolchain', 'stdlib/lampe/lake-manifest.json', 'stdlib/lampe/lakefile.toml', '!**/.lake/**') }}"
          } >> "$GITHUB_OUTPUT"
      - name: Probe Rustfmt Cache
        id: rustfmt
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/rustfmt
          key: ${{ steps.keys.outputs.rustfmt_key }}
          lookup-only: true
      - name: Probe Rust Lint Cache
        id: rustlint
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/rustlint
          key: ${{ steps.keys.outputs.rustlint_key }}
          lookup-only: true
      - name: Probe Rust Test Cache
        id: rusttest
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/rusttest
          key: ${{ steps.keys.outputs.rusttest_key }}
          lookup-only: true
      - name: Probe E2E Cache
        id: e2e
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/e2e
          key: ${{ steps.keys.outputs.e2e_key }}
          lookup-only: true
      - name: Probe Lampe Build Cache
        id: lampe
        uses: actions/cache/restore@v5
        with:
          path: Lampe/.lake/build
          key: ${{ steps.keys.outputs.lampe_key }}
          lookup-only: true
      - name: Probe Stdlib Build Cache
        id: stdlib
        uses: actions/cache/restore@v5
        with:
          path: stdlib/lampe/.lake/build
          key: ${{ steps.keys.outputs.stdlib_key }}
          lookup-only: true

  ensure-noir-version:
    name: Check Noir Versions
    needs: build-ci-image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reilabs/lampe-ci:${{ needs.build-ci-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v6
      - name: Check Noir Version Consistency
        run: scripts/check_noir_version_consistency.xsh

  check-rust-formatting:
    name: Check Rust Formatting
    needs: [build-ci-image, keys]
    if: needs.keys.outputs.rustfmt_hit != 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reilabs/lampe-ci:${{ needs.build-ci-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Check Formatting
        run: cargo +nightly fmt --all -- --check
      - name: Mark Rustfmt Cache
        run: |
          mkdir -p .ci-cache/rustfmt
          echo "ok" > .ci-cache/rustfmt/success
      - name: Save Rustfmt Cache
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/rustfmt
          key: ${{ needs.keys.outputs.rustfmt_key }}

  lint-rust:
    name: Lint Rust
    needs: [build-ci-image, keys]
    if: needs.keys.outputs.rustlint_hit != 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reilabs/lampe-ci:${{ needs.build-ci-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v6
      - name: Lint (Clippy)
        run: RUSTFLAGS="-Dwarnings" cargo clippy --all-targets --all-features
      - name: Mark Rust Lint Cache
        run: |
          mkdir -p .ci-cache/rustlint
          echo "ok" > .ci-cache/rustlint/success
      - name: Save Rust Lint Cache
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/rustlint
          key: ${{ needs.keys.outputs.rustlint_key }}

  test-rust:
    name: Test Rust
    needs: [build-ci-image, keys]
    if: needs.keys.outputs.rusttest_hit != 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reilabs/lampe-ci:${{ needs.build-ci-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v6
      - name: Test (Cargo)
        run: cargo test --all
      - name: Remove Build Artifacts
        run: rm -rf target
      - name: Mark Rust Test Cache
        run: |
          mkdir -p .ci-cache/rusttest
          echo "ok" > .ci-cache/rusttest/success
      - name: Save Rust Test Cache
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/rusttest
          key: ${{ needs.keys.outputs.rusttest_key }}

  build-rust:
    name: Build CLI
    needs: [build-ci-image, keys, check-rust-formatting, lint-rust, test-rust]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reilabs/lampe-ci:${{ needs.build-ci-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v6
      - name: Restore CLI Cache
        id: cli-cache
        uses: actions/cache@v5
        with:
          path: target/release/lampe
          key: ${{ needs.keys.outputs.cli_key }}
      - name: Build (Cargo)
        if: ${{ steps.cli-cache.outputs.cache-hit != 'true' }}
        run: cargo build --release
      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lampe-cli-${{ github.sha }}
          path: target/release/lampe

  build-lean:
    name: Build Lampe
    needs: [build-ci-image, keys]
    if: needs.keys.outputs.lampe_hit != 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reilabs/lampe-ci:${{ needs.build-ci-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Current Branch (Sparse)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            Lampe
            scripts/ci
            stdlib/lampe/lean-toolchain
            stdlib/lampe/lake-manifest.json
      - name: Set Lake Package Dir
        run: |
          mkdir -p "$RUNNER_TEMP/lake-packages"
          echo "LAKE_PKG_DIR=$RUNNER_TEMP/lake-packages" >> "$GITHUB_ENV"
      - name: Point Lampe Lake Packages At Shared Dir
        run: python3 scripts/ci/link_lake_packages.py Lampe
      - name: Restore Lampe Build Cache
        uses: actions/cache@v5
        with:
          path: Lampe/.lake/build
          key: ${{ needs.keys.outputs.lampe_key }}
          restore-keys: |
            lampe-build-${{ runner.os }}-
      - name: Get Mathlib Cache
        working-directory: Lampe
        run: lake exe cache get || echo "cache get failed; continuing so the build step surfaces the real error"
      - name: Make All (Lampe)
        working-directory: Lampe
        run: lake exe mk_all --check --lib Lampe
      - name: Build Lampe
        working-directory: Lampe
        run: lake build
      - name: Test Lampe
        working-directory: Lampe
        run: lake test

  build-stdlib:
    name: Build Stdlib
    needs: [build-ci-image, keys, build-rust, build-lean, ensure-noir-version]
    if: ${{ !failure() && !cancelled() && needs.keys.outputs.stdlib_hit != 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reilabs/lampe-ci:${{ needs.build-ci-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v6
      - name: Set Lake Package Dir
        run: |
          mkdir -p "$RUNNER_TEMP/lake-packages"
          echo "LAKE_PKG_DIR=$RUNNER_TEMP/lake-packages" >> "$GITHUB_ENV"
      - name: Restore Lampe Build Cache
        uses: actions/cache/restore@v5
        with:
          path: Lampe/.lake/build
          key: ${{ needs.keys.outputs.lampe_key }}
          restore-keys: |
            lampe-build-${{ runner.os }}-
      - name: Restore Stdlib Build Cache
        uses: actions/cache@v5
        with:
          path: stdlib/lampe/.lake/build
          key: ${{ needs.keys.outputs.stdlib_key }}
          restore-keys: |
            stdlib-build-${{ runner.os }}-
      - name: Download CLI Artifact
        uses: actions/download-artifact@v4
        with:
          name: lampe-cli-${{ github.sha }}
          path: target/release
      - name: Ensure CLI Executable
        # upload-artifact zips files and drops the exec bit.
        run: chmod +x target/release/lampe
      - name: Test Stdlib Extraction
        run: ./stdlib/test.xsh

  end-to-end:
    name: E2E Tests
    needs: [build-ci-image, keys, build-rust, build-stdlib, build-lean, ensure-noir-version]
    if: ${{ !failure() && !cancelled() && needs.keys.outputs.e2e_hit != 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/reilabs/lampe-ci:${{ needs.build-ci-image.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Current Branch
        uses: actions/checkout@v6
      - name: Set Lake Package Dir
        run: |
          mkdir -p "$RUNNER_TEMP/lake-packages"
          echo "LAKE_PKG_DIR=$RUNNER_TEMP/lake-packages" >> "$GITHUB_ENV"
      - name: Restore Lampe Build Cache
        uses: actions/cache/restore@v5
        with:
          path: Lampe/.lake/build
          key: ${{ needs.keys.outputs.lampe_key }}
          restore-keys: |
            lampe-build-${{ runner.os }}-
      - name: Restore Stdlib Build Cache
        uses: actions/cache/restore@v5
        with:
          path: stdlib/lampe/.lake/build
          key: ${{ needs.keys.outputs.stdlib_key }}
          restore-keys: |
            stdlib-build-${{ runner.os }}-
      - name: Point Stdlib Lake Packages At Shared Cache
        run: python3 scripts/ci/link_lake_packages.py stdlib/lampe
      - name: Download CLI Artifact
        uses: actions/download-artifact@v4
        with:
          name: lampe-cli-${{ github.sha }}
          path: target/release
      - name: Ensure CLI Executable
        # upload-artifact zips files and drops the exec bit.
        run: chmod +x target/release/lampe
      - name: Free Runner Disk Space
        uses: ./.github/actions/free-disk-space
      - name: Run Test Script
        run: ./testing/test.xsh
      - name: Mark E2E Cache
        run: |
          mkdir -p .ci-cache/e2e
          echo "ok" > .ci-cache/e2e/success
      - name: Save E2E Cache
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/e2e
          key: ${{ needs.keys.outputs.e2e_key }}
